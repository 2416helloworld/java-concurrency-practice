name: CI

on:
  push:
  pull_request:

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Judge answers
        run: mvn -B -Danswer.user=alice verify
